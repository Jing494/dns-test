name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dnsutils perl curl
      - name: Syntax check
        run: |
          for f in *.sh tools/network/*.sh; do bash -n "$f" || exit 1; done
          for f in $(find . -name '*.pl'); do perl -c "$f" >/dev/null 2>&1 || exit 1; done
      - name: Run smoke test
        # 网络敏感项（ePDG等用省级DNS）在GitHub runner海外环境可能偶发超时，
        # 故 continue-on-error：失败不阻塞CI，输出仍可见
        continue-on-error: true
        run: bash smoke_test.sh
