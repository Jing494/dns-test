name: Smoke Test

on:
  push:
    branches: [main, develop, tool_list-test]
  pull_request:

# 同分支/同PR重复推送只保留最新一次运行（省 runner 时间）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 严格层：纯确定性项（语法/shellcheck/注入拦截/不可达预检/本地数据聚合），失败即红
  # 不依赖网络，海外 runner 不会误红 —— 真实回归会被拦截
  # 双平台矩阵：macOS 的 bash -n 用自带 bash 3.2（能抓 4+ 语法），shellcheck/插件检查/单测全跑
  strict:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get install -y shellcheck
          fi
      - name: Strict checks (deterministic, no network)
        run: |
          echo "--- 1. 语法检查"
          for f in *.sh tools/*.sh tools/network/*.sh; do bash -n "$f" || { echo "❌ $f"; exit 1; }; done
          for f in $(find . -name '*.pl'); do perl -c "$f" >/dev/null 2>&1 || { echo "❌ $f"; exit 1; }; done
          echo "  ✅ 语法OK"
          echo "--- 2. shellcheck（严格）"
          shellcheck -S warning *.sh tools/*.sh tools/network/*.sh lib/*.sh || { echo "❌ shellcheck 有告警"; exit 1; }
          echo "  ✅ shellcheck 0 告警"
          echo "--- 3. 注入拦截（断言退出码=1，不依赖输出文本）"
          if bash lite.sh '1.1.1.1;id' >/dev/null 2>&1; then
            echo "❌ 注入未被拦截"; exit 1
          fi
          echo "  ✅ 注入拦截"
          echo "--- 4. 不可达预检"
          bash lite.sh 192.0.2.1 0 2>&1 | grep -q "不可达" || { echo "❌ 不可达预检失败"; exit 1; }
          echo "  ✅ 不可达预检"
          echo "--- 5. trends 本地数据聚合（无网络）"
          TMPR=$(mktemp -d)
          cat > "$TMPR/compare-20260810-090000.json" <<'EOF'
          {"tool":"x","version":"v2026.08.3","timestamp":"2026-08-10 09:00:00 +0800","mode":"lite(63项)","cost_s":1,"dns":[{"addr":"223.5.5.5","score":"96","stab":"100","delay_ms":60,"reachable":true}]}
          EOF
          cat > "$TMPR/compare-20260811-090000.json" <<'EOF'
          {"tool":"x","version":"v2026.08.3","timestamp":"2026-08-11 09:00:00 +0800","mode":"lite(63项)","cost_s":1,"dns":[{"addr":"223.5.5.5","score":"98","stab":"100","delay_ms":50,"reachable":true}]}
          EOF
          COMPARE_RESULTS_DIR="$TMPR" TRENDS_DIR="$TMPR/out" bash trends.sh 223.5.5.5 --html --csv >/dev/null || { echo "❌ trends聚合失败"; exit 1; }
          ls "$TMPR/out/report.html" "$TMPR/out/trends.csv" >/dev/null 2>&1 || { echo "❌ trends产物缺失"; exit 1; }
          rm -rf "$TMPR"
          echo "  ✅ trends 聚合+产物"
          echo "--- 6. 单元测试（DNSUtil perl 18用例 + plugins bash 9用例 + dig_target 4用例）"
          perl -Ilib tests/01_dnsutil.t >/dev/null 2>&1 || { echo "❌ perl单测失败"; exit 1; }
          bash tests/02_plugins.sh >/dev/null 2>&1 || { echo "❌ bash单测失败"; exit 1; }
          bash tests/03_dig_target.sh >/dev/null 2>&1 || { echo "❌ dig_target单测失败"; exit 1; }
          echo "  ✅ 单元测试通过"
          echo "--- 7. 插件系统（清单/脚本存在/拦截，无网络）"
          source lib/plugins.sh
          [ ${#PLUGIN_ITEMS[@]} -ge 10 ] || { echo "❌ 插件清单少于10项"; exit 1; }
          plugin_list | grep -q "VoWiFi域名" || { echo "❌ plugin_list 输出异常"; exit 1; }
          for item in "${PLUGIN_ITEMS[@]}"; do
            P_ID="${item%%|*}"; rest="${item#*|}"
            P_SCRIPT="${rest%%|*}"
            dir="PLUGIN_DIR_$P_ID"; dir="${!dir}"
            [ -f "${dir}/${P_SCRIPT}" ] || { echo "❌ 插件脚本缺失: ${dir}/${P_SCRIPT}"; exit 1; }
          done
          echo "  ✅ 插件清单+脚本存在"
          if plugin_run 999 >/dev/null 2>&1; then echo "❌ 无效编号未拦截"; exit 1; fi
          # 未知执行器拦截：在子 shell 内设数组+屏蔽 manifest（环境变量前缀传数组只传首个元素，会失效）
          bash -c 'PLUGIN_MANIFEST=/dev/null; PLUGIN_ITEMS=("x|dns-test.sh|测试|python|"); PLUGIN_DIR_x="."; source lib/plugins.sh && plugin_run 1' >/dev/null 2>&1 && { echo "❌ 未知执行器未拦截"; exit 1; }
          echo "  ✅ 插件拦截"
          echo "════ Strict checks 全部通过 ════"

  # 容错层：完整冒烟（含网络敏感项：ePDG/路由器/省级DNS等）
  # 海外 runner 网络波动可能偶发超时，故 continue-on-error：失败不阻塞，产物仍上传可排查
  # fork 的 PR 跳过网络冒烟（安全/成本：不可信代码不跑网络敏感测试）
  smoke:
    needs: strict
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # macOS runner 自带 dig/perl/curl，无需 brew；Linux 用 apt 装
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            command -v dig || brew install bind
          else
            sudo apt-get update && sudo apt-get install -y dnsutils perl curl
          fi
      - name: Syntax check
        run: |
          for f in *.sh tools/*.sh tools/network/*.sh; do bash -n "$f" || exit 1; done
          for f in $(find . -name '*.pl'); do perl -c "$f" >/dev/null 2>&1 || exit 1; done
      - name: Run smoke test
        # 注意：macOS runner 默认 /bin/bash 是 3.2（无关联数组），
        # 全部脚本已按 bash 3.2 兼容编写（compare/trends 用平行数组），
        # 若冒烟出现语法/运行报错请先检查是否引入了 bash 4+ 专属语法。
        continue-on-error: true
        run: bash smoke_test.sh
      - name: Upload results (always)
        # 即使冒烟有失败项也上传产物，便于排查（results/ 与 trends/ 均不入库）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.os }}
          path: |
            results/
            trends/
          if-no-files-found: ignore
